name: myampmix_analytics
description: MyAmpMix Flutter analytics SDK — offline-first event tracking for the self-hosted MyAmpMix platform.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  crypto: ^3.0.0
  device_info_plus: ^11.3.0
  drift: ^2.26.0
  http: ^1.3.0
  http_parser: ^4.0.0
  image: ^4.3.0
  package_info_plus: ^8.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0
  sqlite3_flutter_libs: ^0.5.30
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.26.0
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# This package is a Flutter plugin: it ships native platform code (iOS
# StoreKit / Android Play Billing) that autocaptures the app's own
# in-app-purchase transactions and forwards them to the Dart side over the
# `myampmix_analytics/purchases` channel (see lib/src/autocapture/
# purchase_autocapture.dart). The existing pure-Dart public API is unchanged.
flutter:
  plugin:
    platforms:
      android:
        package: com.myampmix.analytics
        pluginClass: MyampmixAnalyticsPlugin
      ios:
        pluginClass: MyampmixAnalyticsPlugin
