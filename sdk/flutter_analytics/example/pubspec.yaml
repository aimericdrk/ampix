name: myampmix_analytics_example
description: >-
  Example Flutter app demonstrating the MyAmpMix analytics SDK
  (myampmix_analytics) via manual instrumentation of a small shopping flow.
publish_to: none
version: 0.1.2

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  myampmix_analytics:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
