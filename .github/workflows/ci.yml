name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile_purchase: ${{ steps.filter.outputs.mobile_purchase }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      sdk: ${{ steps.filter.outputs.sdk }}
      k8s: ${{ steps.filter.outputs.k8s }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/mobile_analytics/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            mobile_purchase:
              - 'backend/mobile_purchase/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            sdk:
              - 'sdk/flutter_analytics/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'admin/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            k8s:
              - 'infra/helm/**'
              - 'infra/k8s/**'
              - 'scripts/k8s/**'
              - '.github/workflows/ci.yml'

  root:
    name: Root lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check

  backend:
    name: Backend — lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # backend/mobile_analytics/ does not exist until the backend sub-project lands.
      # Every subsequent step is guarded so this job passes as a no-op until then.
      - name: Check backend package exists
        id: pkg
        run: |
          if [ -f backend/mobile_analytics/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/mobile_analytics/package.json not found — backend not scaffolded yet, skipping"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.pkg.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.pkg.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./backend/mobile_analytics run --if-present lint
      - name: Typecheck
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./backend/mobile_analytics run --if-present typecheck
      # Coverage-gated (README floor: backend 85% lines). test:cov runs the unit +
      # integration projects; Testcontainers spin up Postgres/Redis via the runner's Docker.
      - name: Tests (coverage-gated)
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./backend/mobile_analytics run test:cov

  mobile_purchase:
    name: Mobile Purchase — lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.mobile_purchase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # backend/mobile_purchase/ does not exist until the sub-project lands.
      # Every subsequent step is guarded so this job passes as a no-op until then.
      - name: Check mobile_purchase package exists
        id: pkg
        run: |
          if [ -f backend/mobile_purchase/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/mobile_purchase/package.json not found — not scaffolded yet, skipping"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.pkg.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.pkg.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./backend/mobile_purchase run --if-present lint
      - name: Typecheck
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./backend/mobile_purchase run --if-present typecheck
      - name: Tests
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./backend/mobile_purchase run --if-present test

  dashboard:
    name: Dashboard — lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard package exists
        id: pkg
        run: |
          if [ -f dashboard/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dashboard/package.json not found — dashboard not scaffolded yet, skipping"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.pkg.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.pkg.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./dashboard run --if-present lint
      - name: Typecheck
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./dashboard run --if-present typecheck
      # Coverage-gated (README floor: dashboard 75%) via vitest's coverage thresholds.
      - name: Tests (coverage-gated)
        if: steps.pkg.outputs.present == 'true'
        run: pnpm --filter ./dashboard run test:coverage

  sdk:
    name: Flutter SDK — analyze, test
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK package exists
        id: pkg
        run: |
          if [ -f sdk/flutter_analytics/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sdk/flutter_analytics/pubspec.yaml not found — SDK not scaffolded yet, skipping"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.pkg.outputs.present == 'true'
        with:
          channel: stable
          flutter-version: 3.32.x
          cache: true
      - name: Pub get
        if: steps.pkg.outputs.present == 'true'
        run: flutter pub get
        working-directory: sdk/flutter_analytics
      - name: Format check
        if: steps.pkg.outputs.present == 'true'
        run: dart format --output=none --set-exit-if-changed .
        working-directory: sdk/flutter_analytics
      - name: Analyze
        if: steps.pkg.outputs.present == 'true'
        run: flutter analyze
        working-directory: sdk/flutter_analytics
      - name: Tests (coverage)
        if: steps.pkg.outputs.present == 'true'
        run: flutter test --coverage
        working-directory: sdk/flutter_analytics
      # README floor: SDK 85% lines, excluding generated code (*.g.dart).
      # Pure-awk gate (no lcov dependency), same filter as the sdk plan (task 14).
      - name: Coverage floor (>= 85% lines, excluding *.g.dart)
        if: steps.pkg.outputs.present == 'true'
        working-directory: sdk/flutter_analytics
        run: |
          awk '/^SF:.*\.g\.dart$/{skip=1} !skip{print} /^end_of_record$/{skip=0}' coverage/lcov.info > coverage/lcov.filtered.info
          awk -F: '/^LF/{lf+=$2} /^LH/{lh+=$2} END{printf "line coverage: %.1f%%\n", 100*lh/lf}' coverage/lcov.filtered.info
          awk -F: '/^LF/{lf+=$2} /^LH/{lh+=$2} END{exit !(100*lh/lf >= 85.0)}' coverage/lcov.filtered.info ||
            { echo "::error::SDK line coverage is below the 85% floor"; exit 1; }

  k8s:
    name: Kubernetes — helm lint, kubeconform, invariants
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz |
            sudo tar -xz -C /usr/local/bin kubeconform
      - name: Lint chart
        run: bash scripts/k8s/lint.sh

  admin:
    name: Admin console — typecheck, test, build
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @myampix/admin typecheck
      - name: Tests
        run: pnpm --filter @myampix/admin test
      - name: Build
        run: pnpm --filter @myampix/admin build
