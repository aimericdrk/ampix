# MyAmpMix local development infrastructure.
# Ports & credentials: docs/superpowers/specs/2026-07-02-shared-contracts.md §2.
# Usage: pnpm infra:up  (docker compose -f infra/docker-compose.yml up -d --wait)
name: myampmix

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native protocol
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: myampmix_dev
      CLICKHOUSE_DB: analytics
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user default --password myampmix_dev --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myampmix
      POSTGRES_PASSWORD: myampmix_dev
      POSTGRES_DB: myampmix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myampmix -d myampmix"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  clickhouse_data:
  postgres_data:
  redis_data:
