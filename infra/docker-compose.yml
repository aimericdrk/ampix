# MyAmpix local development infrastructure.
# Ports & credentials: docs/superpowers/specs/2026-07-02-shared-contracts.md §2.
# Usage: pnpm infra:up  (docker compose -f infra/docker-compose.yml up -d --wait)
name: myampix

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native protocol
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: myampix_dev
      CLICKHOUSE_DB: analytics
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user default --password myampix_dev --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myampix
      POSTGRES_PASSWORD: myampix_dev
      POSTGRES_DB: myampix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myampix -d myampix"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Standalone Postgres for the mobile-purchase (RevenueCat-style) service — genuinely separate
  # from the analytics `postgres` service above (own port, own credentials, own volume).
  mobile-purchase-postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mobile_purchase
      POSTGRES_PASSWORD: mobile_purchase_dev
      POSTGRES_DB: mobile_purchase
    volumes:
      - mobile_purchase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobile_purchase"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Web-based Postgres explorer — browse and edit data at http://localhost:8082
  # Login: System "PostgreSQL", Server "postgres", user "myampix" / pass "myampix_dev", db "myampix"
  adminer:
    image: adminer:4
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

  # Web-based ClickHouse explorer — browse and query data at http://localhost:5521
  # Connection is pre-filled; the browser talks to ClickHouse via the host-exposed 8123 port.
  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    ports:
      - "5521:5521"
    environment:
      VITE_CLICKHOUSE_URL: "http://localhost:8123"
      VITE_CLICKHOUSE_USER: default
      VITE_CLICKHOUSE_PASS: myampix_dev
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  postgres_data:
  redis_data:
  mobile_purchase_postgres_data:
