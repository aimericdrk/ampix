# Runs the backend as a container against the local Compose DB stack — the proof that the image works.
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml up --build backend
#
# This is a local-run overlay only. GCP/Cloud Run deployment is a later X1 increment.
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Dev secrets (JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, TOTP_ENC_KEY) come from the gitignored
    # backend/.env — never committed. Path is relative to this compose file (infra/).
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: development
      PORT: "8088"
      # DB hosts point at the Compose service names (the localhost values in backend/.env don't
      # resolve inside the container; `environment` overrides `env_file`). Dev creds match
      # infra/docker-compose.yml and are dev-only.
      DATABASE_URL: postgresql://myampix:myampix_dev@postgres:5432/myampix
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: myampix_dev
      CLICKHOUSE_DB: analytics
      REDIS_URL: redis://redis:6379
    ports:
      - "8088:8088"
