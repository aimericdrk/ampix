{{- if .Values.purchase.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mobile-purchase-api
  labels:
    {{- include "myampix.labels" . | nindent 4 }}
    {{- include "myampix.selectorLabels" (dict "root" . "name" "mobile-purchase" "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "myampix.selectorLabels" (dict "root" . "name" "mobile-purchase" "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
{{- end }}
