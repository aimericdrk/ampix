{{- if .Values.analytics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-analytics-config
  labels:
    {{- include "myampix.labels" . | nindent 4 }}
    {{- include "myampix.selectorLabels" (dict "root" . "name" "mobile-analytics" "component" "api") | nindent 4 }}
data:
  NODE_ENV: production
  PORT: "8088"
  {{- if .Values.analytics.googleCredentials.enabled }}
  # Derived from the volume mount rather than hand-written, so the path the app reads and the path
  # the Secret is projected to can never drift apart.
  GOOGLE_APPLICATION_CREDENTIALS: {{ printf "%s/%s" (trimSuffix "/" .Values.analytics.googleCredentials.mountPath) .Values.analytics.googleCredentials.fileName | quote }}
  {{- end }}
  {{- range $k, $v := .Values.analytics.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
