{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: admin
  labels:
    {{- include "myampix.labels" . | nindent 4 }}
    {{- include "myampix.selectorLabels" (dict "root" . "name" "admin" "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "myampix.selectorLabels" (dict "root" . "name" "admin" "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
{{- end }}
