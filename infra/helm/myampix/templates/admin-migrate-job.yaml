{{- if .Values.admin.enabled }}
{{- $a := .Values.admin }}
{{- $sel := dict "root" . "name" "admin" "component" "migrate" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-admin-migrate
  labels:
    {{- include "myampix.labels" . | nindent 4 }}
    {{- include "myampix.selectorLabels" $sel | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "myampix.labels" . | nindent 8 }}
        {{- include "myampix.selectorLabels" $sel | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "myampix.hostDbAliases" . | nindent 6 }}
      {{- include "myampix.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "myampix.podSecurityContext" . | nindent 8 }}
        runAsUser: {{ $a.runAsUser }}
        runAsGroup: {{ $a.runAsGroup }}
      containers:
        - name: migrate
          # Creates the admin_console DB if missing, applies migrations, seeds the default admin
          # (only when the user table is empty — see admin/scripts/migrate.mjs).
          image: {{ include "myampix.image" (dict "root" . "name" "admin-migrate") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CHECKPOINT_DISABLE
              value: "1"
          envFrom:
            - secretRef:
                name: {{ $a.secretName }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
