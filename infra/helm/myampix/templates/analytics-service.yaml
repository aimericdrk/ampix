{{- if .Values.analytics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mobile-analytics
  labels:
    {{- include "myampix.labels" . | nindent 4 }}
    {{- include "myampix.selectorLabels" (dict "root" . "name" "mobile-analytics" "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "myampix.selectorLabels" (dict "root" . "name" "mobile-analytics" "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8088
      targetPort: http
      protocol: TCP
{{- end }}
