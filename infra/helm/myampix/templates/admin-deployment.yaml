{{- if .Values.admin.enabled }}
{{- $a := .Values.admin }}
{{- $sel := dict "root" . "name" "admin" "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    {{- include "myampix.labels" . | nindent 4 }}
    {{- include "myampix.selectorLabels" $sel | nindent 4 }}
spec:
  replicas: {{ $a.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "myampix.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myampix.labels" . | nindent 8 }}
        {{- include "myampix.selectorLabels" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/admin-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: myampix-admin
      # The one Deployment that mounts a ServiceAccount token — the console reads cluster state.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- include "myampix.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "myampix.podSecurityContext" . | nindent 8 }}
        runAsUser: {{ $a.runAsUser }}
        runAsGroup: {{ $a.runAsGroup }}
        {{- if or $a.dockerSock.enabled $a.backups.enabled }}
        # Group memberships the container needs for its host mounts:
        #   dockerSock.gid  → read the host docker.sock (root:docker, 660)
        #   backups.gid     → read/write the backup tree (root:myampix-backup, 2770)
        supplementalGroups:
          {{- if $a.dockerSock.enabled }}
          - {{ $a.dockerSock.gid }}
          {{- end }}
          {{- if $a.backups.enabled }}
          - {{ $a.backups.gid }}
          {{- end }}
        {{- end }}
      containers:
        - name: web
          image: {{ include "myampix.image" (dict "root" . "name" "admin") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: POD_NAMESPACE # ops actions are scoped to this namespace (v2 design Phase 2)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-admin-config
            - secretRef:
                name: {{ $a.secretName }}
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: "/api/healthz?ready=1", port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          securityContext:
            {{- include "myampix.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/admin/.next/cache
            {{- if $a.dockerSock.enabled }}
            - name: docker-sock
              mountPath: {{ $a.dockerSock.path }}
              readOnly: true
            {{- end }}
            {{- if $a.backups.enabled }}
            # Writable: deleting a backup and creating the run-request marker are both writes.
            - name: backups
              mountPath: {{ $a.backups.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        {{- if $a.dockerSock.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ $a.dockerSock.path }}
            type: Socket
        {{- end }}
        {{- if $a.backups.enabled }}
        - name: backups
          hostPath:
            path: {{ $a.backups.hostPath }}
            type: Directory
        {{- end }}
{{- end }}
