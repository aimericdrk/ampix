{{- if .Values.admin.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  labels:
    {{- include "myampix.labels" . | nindent 4 }}
    {{- include "myampix.selectorLabels" (dict "root" . "name" "admin" "component" "web") | nindent 4 }}
  annotations:
    {{- if .Values.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts: [{{ .Values.hosts.admin | quote }}]
      secretName: {{ include "myampix.tlsSecret" .Values.hosts.admin }}
  {{- end }}
  rules:
    - host: {{ .Values.hosts.admin | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  name: http
{{- end }}
